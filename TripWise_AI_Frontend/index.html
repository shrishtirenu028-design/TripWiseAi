<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripWise AI — Plan Once. Adapt Always.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast-container"></div>

  <header class="navbar">
    <a class="brand" href="#" data-page="home"><span class="brand-icon">🧳</span><span>TripWise <b>AI</b></span></a>
    <button class="mobile-toggle" id="mobile-toggle" aria-label="Open menu">☰</button>
    <nav id="main-nav">
      <a href="#" data-page="home">Home</a>
      <a href="#" data-page="planner">Plan Trip</a>
      <a href="#" data-page="trips">My Trips</a>
      <a href="#" data-page="explore">Explore</a>
      <a href="#" data-page="assistant">Trip Assistant</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn" onclick="showToast('You’re all caught up!')">🔔</button>
      <button class="profile-mini" data-page="profile"><span>SD</span><i>⌄</i></button>
    </div>
  </header>

  <main>
    <section id="home" class="page active"></section>
    <section id="planner" class="page"></section>
    <section id="itinerary" class="page"></section>
    <section id="assistant" class="page"></section>
    <section id="explore" class="page"></section>
    <section id="trips" class="page"></section>
    <section id="profile" class="page"></section>
  </main>

  <div class="modal" id="modal">
    <div class="modal-card" id="modal-content"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
